  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

bkit-scrollbar-thumb{background:#c9b79a;border:2px solid #0f0b08}\n::-webkit-scrollbar-thumb:hover{background:#c1442a}\n@keyframes grain{0%,100%{transform:translate(0,0)}10%{transform:translate(-4%,-4%)}30%{transform:translate(3%,-2%)}50%{transform:translate(-2%,3%)}70%{transform:translate(4%,2%)}90%{transform:translate(-3%,4%)}}\n@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n@keyframes glowpulse{0%,100%{opacity:.55}50%{opacity:1}}\n@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}\n@keyframes riseIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}\n@keyframes wipeGo{0%{transform:scaleX(0);transform-origin:left}55%{transform:scaleX(1);transform-origin:left}56%{transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}\n@keyframes appIn{from{transform:translateY(10px)}to{transform:translateY(0)}}\n@keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(-2deg)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"position:relative;min-height:100vh;background:#f2e8d8;color:#241a10;font-family:Archivo,sans-serif;overflow-x:hidden\">\n\n  <sc-if value=\"{{ showGlow }}\" hint-placeholder-val=\"{{ true }}\"><div ref=\"{{ glowRef }}\" style=\"position:fixed;inset:0;pointer-events:none;z-index:60;mix-blend-mode:multiply;background:radial-gradient(600px circle at 50% 0%,rgba(200,140,50,.12),transparent 60%)\"><\u002Fdiv><\u002Fsc-if>\n  <sc-if value=\"{{ showGrain }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"position:fixed;inset:0;pointer-events:none;z-index:61;opacity:.05;background-image:url('data:image/svg+xml;utf8,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22&gt;&lt;filter id=%22n%22&gt;&lt;feTurbulence type=%22fractalNoise%22 baseFrequency=%220.9%22 numOctaves=%222%22/&gt;&lt;/filter&gt;&lt;rect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/&gt;&lt;/svg&gt;');animation:grain 1.1s steps(3) infinite\"><\u002Fdiv><\u002Fsc-if>\n  <div style=\"position:fixed;inset:0;pointer-events:none;z-index:59;box-shadow:inset 0 0 220px 40px rgba(120,90,40,.10)\"><\u002Fdiv>\n\n  <sc-if value=\"{{ wiping }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:200;background:#c1442a;animation:wipeGo 1.05s cubic-bezier(.7,0,.2,1) forwards;display:flex;align-items:center;justify-content:center\">\n      <div style=\"font-family:'Space Mono',monospace;color:#0f0b08;font-size:13px;letter-spacing:.5em;font-weight:700\">OPENING THE LEDGER<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isLanding }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:26px clamp(20px,4vw,64px) 30px\">\n\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1.5px solid rgba(36,26,16,.15);padding-bottom:16px;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.14em\">\n        <div style=\"display:flex;flex-direction:column;gap:3px\">\n          <span style=\"color:#a5620c;font-weight:700\">◆ THE DAILY LEDGER<\u002Fspan>\n          <span style=\"color:#7a6544\">A PERSONAL RECORD · EST. {{ year }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"text-align:right;display:flex;flex-direction:column;gap:3px\">\n          <span style=\"color:#241a10;font-weight:700;font-size:14px\">{{ clock }}<span style=\"animation:blink 1s step-end infinite\">_<\u002Fspan><\u002Fspan>\n          <span style=\"color:#7a6544\">{{ todayLong }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:2vh 0;max-width:1100px\">\n        <div style=\"font-family:'Space Mono',monospace;font-size:clamp(11px,1.1vw,13px);letter-spacing:.42em;color:#c1442a;font-weight:700;margin-bottom:8px\">LOGS · JOURNAL · FIELD NOTES<\u002Fdiv>\n        <h1 style=\"margin:0;font-weight:900;line-height:.82;letter-spacing:-.03em;text-transform:uppercase;font-size:clamp(64px,13.5vw,220px)\">\n          <span style=\"display:block;color:#241a10\">The Daily<\u002Fspan>\n          <span style=\"display:block;color:transparent;-webkit-text-stroke:2.5px #e9a53f;position:relative\">Ledger<span style=\"position:absolute;left:0;top:0;color:#c1442a;-webkit-text-stroke:0;z-index:-1;transform:translate(10px,10px);opacity:.9\">Ledger<\u002Fspan><\u002Fspan>\n        <\u002Fh1>\n        <p style=\"margin:22px 0 0;max-width:520px;font-family:'Instrument Serif',serif;font-size:clamp(20px,2.4vw,30px);line-height:1.32;color:#5a4a34;font-style:italic\">Write the day down before it forgets itself. A brutal, honest logbook for moods, momentum and the small evidence of a life.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n        <div style=\"overflow:hidden;border-top:1.5px solid rgba(36,26,16,.15);border-bottom:1.5px solid rgba(36,26,16,.15);padding:10px 0;white-space:nowrap\">\n          <div style=\"display:inline-block;animation:marq 22s linear infinite;font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em\">\n            <span style=\"color:#7a6544\">WRITE IT DOWN<\u002Fspan> <span style=\"color:#c1442a\">✦<\u002Fspan> <span style=\"color:#241a10\">KEEP THE STREAK<\u002Fspan> <span style=\"color:#c1442a\">✦<\u002Fspan> <span style=\"color:#7a6544\">TRACK YOUR DAYS<\u002Fspan> <span style=\"color:#c1442a\">✦<\u002Fspan> <span style=\"color:#a5620c\">NOTHING GETS LOST<\u002Fspan> <span style=\"color:#c1442a\">✦<\u002Fspan> <span style=\"color:#7a6544\">WRITE IT DOWN<\u002Fspan> <span style=\"color:#c1442a\">✦<\u002Fspan> <span style=\"color:#241a10\">KEEP THE STREAK<\u002Fspan> <span style=\"color:#c1442a\">✦<\u002Fspan> <span style=\"color:#7a6544\">TRACK YOUR DAYS<\u002Fspan> <span style=\"color:#c1442a\">✦<\u002Fspan> <span style=\"color:#a5620c\">NOTHING GETS LOST<\u002Fspan> <span style=\"color:#c1442a\">✦<\u002Fspan> \n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:24px\">\n          <button onclick=\"{{ enter }}\" style=\"cursor:pointer;border:none;background:#e9a53f;color:#0f0b08;font-family:'Space Mono',monospace;font-weight:700;font-size:clamp(15px,1.7vw,20px);letter-spacing:.12em;padding:20px 34px;box-shadow:9px 9px 0 #c1442a;transition:transform .14s ease,box-shadow .14s ease;text-transform:uppercase\" style-hover=\"transform:translate(9px,9px);box-shadow:0 0 0 #c1442a;background:#f4cf63\">ENTER THE LEDGER →<\u002Fbutton>\n          <div style=\"font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.12em;color:#7a6544;text-align:right;line-height:1.8\">\n            <div><span style=\"color:#a5620c;font-weight:700\">{{ totalEntries }}<\u002Fspan> ENTRIES LOGGED<\u002Fdiv>\n            <div><span style=\"color:#a5620c;font-weight:700\">{{ streak }}<\u002Fspan> DAY STREAK · KEEP IT ALIVE<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isApp }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:relative;z-index:2;min-height:100vh;animation:appIn .5s ease both;display:flex;flex-direction:column\">\n\n      <header style=\"position:sticky;top:0;z-index:40;background:rgba(244,236,222,.9);backdrop-filter:blur(8px);border-bottom:1.5px solid rgba(36,26,16,.15);display:flex;align-items:stretch;justify-content:space-between;flex-wrap:wrap\">\n        <div onclick=\"{{ goHome }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:14px;padding:12px clamp(13px,2vw,22px);border-right:1.5px solid rgba(36,26,16,.15)\">\n          <div style=\"width:13px;height:13px;background:#c1442a;box-shadow:4px 4px 0 #e9a53f\"><\u002Fdiv>\n          <div style=\"font-weight:900;font-size:16px;letter-spacing:-.01em;text-transform:uppercase;line-height:1\">THE DAILY<br><span style=\"color:#a5620c\">LEDGER<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <nav style=\"display:flex;align-items:stretch;flex:1 1 200px;min-width:200px;overflow-x:auto\">\n          <sc-for list=\"{{ navItems }}\" as=\"n\" hint-placeholder-count=\"3\">\n            <button onclick=\"{{ n.go }}\" style=\"cursor:pointer;flex-shrink:0;white-space:nowrap;background:{{ n.bg }};color:{{ n.fg }};border:none;border-right:1.5px solid rgba(36,26,16,.15);font-family:'Space Mono',monospace;font-weight:700;font-size:11px;letter-spacing:.1em;padding:0 clamp(10px,1.5vw,17px);text-transform:uppercase;transition:background .15s,color .15s;display:flex;align-items:center;gap:9px\" style-hover=\"background:#e3d5bc;color:#241a10\">\n              <span style=\"font-size:13px\">{{ n.icon }}<\u002Fspan>{{ n.label }}\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fnav>\n\n        <div style=\"display:flex;align-items:stretch;flex-shrink:0;margin-left:auto\">\n        <input ref=\"{{ fileRef }}\" type=\"file\" accept=\"application/json,.json\" onchange=\"{{ onImportFile }}\" style=\"display:none\">\n        <button onclick=\"{{ exportEntries }}\" title=\"Download all entries as a backup file\" style=\"cursor:pointer;background:transparent;color:#7a6544;border:none;border-left:1.5px solid rgba(36,26,16,.15);font-family:'Space Mono',monospace;font-weight:700;font-size:10px;letter-spacing:.06em;padding:0 clamp(8px,1.2vw,13px);text-transform:uppercase;transition:all .15s;display:flex;align-items:center\" style-hover=\"background:#e3d5bc;color:#241a10\">↓ BACKUP<\u002Fbutton>\n        <button onclick=\"{{ triggerImport }}\" title=\"Restore entries from a backup file\" style=\"cursor:pointer;background:transparent;color:#7a6544;border:none;border-left:1.5px solid rgba(36,26,16,.15);font-family:'Space Mono',monospace;font-weight:700;font-size:10px;letter-spacing:.06em;padding:0 clamp(8px,1.2vw,13px);text-transform:uppercase;transition:all .15s;display:flex;align-items:center\" style-hover=\"background:#e3d5bc;color:#241a10\">↑ RESTORE<\u002Fbutton>\n        <button onclick=\"{{ openNew }}\" style=\"cursor:pointer;background:#e9a53f;color:#0f0b08;border:none;font-family:'Space Mono',monospace;font-weight:700;font-size:11px;letter-spacing:.1em;padding:0 clamp(12px,1.8vw,20px);text-transform:uppercase;transition:background .15s\" style-hover=\"background:#f4cf63\">+ WRITE<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fheader>\n\n      <main style=\"flex:1;position:relative\">\n        <sc-if value=\"{{ isTimeline }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:clamp(20px,3vw,44px) clamp(18px,4vw,64px) 120px\">\n\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;margin-bottom:26px\">\n              <div>\n                <div style=\"font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.28em;color:#c1442a;font-weight:700;margin-bottom:6px\">01 — THE LOG<\u002Fdiv>\n                <h2 style=\"margin:0;font-weight:900;font-size:clamp(38px,6vw,74px);line-height:.9;text-transform:uppercase;letter-spacing:-.02em\">Every<br>Single Day<\u002Fh2>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:12px;border:1.5px solid rgba(36,26,16,.2);padding:11px 15px;min-width:min(320px,80vw);background:#ece0cb\">\n                <span style=\"color:#7a6544;font-family:'Space Mono',monospace;font-size:14px\">⌕<\u002Fspan>\n                <input value=\"{{ query }}\" oninput=\"{{ onSearch }}\" placeholder=\"SEARCH ENTRIES + TAGS\" style=\"flex:1;background:transparent;border:none;outline:none;color:#241a10;font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.06em\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:34px\">\n              <sc-for list=\"{{ tagChips }}\" as=\"t\" hint-placeholder-count=\"6\">\n                <button onclick=\"{{ t.toggle }}\" style=\"cursor:pointer;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.14em;padding:7px 13px;text-transform:uppercase;border:1.5px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }};transition:all .13s\">{{ t.hash }}{{ t.name }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ hasGroups }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-direction:column;gap:44px\">\n                <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"3\">\n                  <div style=\"display:grid;grid-template-columns:clamp(90px,12vw,150px) 1fr;gap:clamp(14px,2.5vw,34px);align-items:start\">\n                    <div style=\"position:sticky;top:96px;text-align:right;border-right:2px solid #c1442a;padding-right:16px\">\n                      <div style=\"font-weight:900;font-size:clamp(46px,6vw,80px);line-height:.8;color:#241a10\">{{ g.day }}<\u002Fdiv>\n                      <div style=\"font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.12em;color:#a5620c;font-weight:700;margin-top:6px\">{{ g.month }}<\u002Fdiv>\n                      <div style=\"font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;color:#7a6544;margin-top:2px\">{{ g.weekday }}<\u002Fdiv>\n                      <div style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;color:#8a7758;margin-top:8px\">{{ g.count }} ENTR{{ g.plural }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:16px\">\n                      <sc-for list=\"{{ g.items }}\" as=\"e\" hint-placeholder-count=\"2\">\n                        <article style=\"position:relative;background:#fbf5ea;border:1.5px solid rgba(36,26,16,.15);border-left:6px solid {{ e.moodColor }};padding:20px 22px;box-shadow:6px 6px 0 rgba(36,26,16,.18);animation:riseIn .5s ease both;transition:transform .15s,box-shadow .15s\" style-hover=\"transform:translate(-2px,-2px);box-shadow:9px 9px 0 rgba(193,68,42,.4)\">\n                          <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:10px\">\n                            <h3 style=\"margin:0;font-weight:800;font-size:clamp(20px,2.4vw,27px);line-height:1.05;letter-spacing:-.01em\">{{ e.title }}<\u002Fh3>\n                            <div style=\"display:flex;gap:6px;flex-shrink:0\">\n                              <button onclick=\"{{ e.edit }}\" style=\"cursor:pointer;background:transparent;border:1.5px solid rgba(36,26,16,.2);color:#7a6544;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.1em;padding:5px 9px;transition:all .13s\" style-hover=\"border-color:#a5620c;color:#a5620c\">EDIT<\u002Fbutton>\n                              <button onclick=\"{{ e.remove }}\" style=\"cursor:pointer;background:transparent;border:1.5px solid rgba(36,26,16,.2);color:#7a6544;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.1em;padding:5px 9px;transition:all .13s\" style-hover=\"border-color:#c1442a;color:#c1442a\">DEL<\u002Fbutton>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                          <p style=\"margin:0 0 16px;font-family:'Instrument Serif',serif;font-size:clamp(17px,1.9vw,21px);line-height:1.42;color:#5a4a34\">{{ e.body }}<\u002Fp>\n                          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em\">\n                            <span style=\"color:#8a7758\">{{ e.time }}<\u002Fspan>\n                            <span style=\"display:inline-flex;align-items:center;gap:6px;color:{{ e.moodColor }};font-weight:700\"><span style=\"width:9px;height:9px;background:{{ e.moodColor }};display:inline-block\"><\u002Fspan>{{ e.moodLabel }}<\u002Fspan>\n                            <span style=\"color:#7a6544\">ENERGY <span style=\"color:#a5620c;font-weight:700\">{{ e.energyBar }}<\u002Fspan><\u002Fspan>\n                            <span style=\"display:flex;gap:6px\">\n                              <sc-for list=\"{{ e.tags }}\" as=\"tg\" hint-placeholder-count=\"2\">\n                                <span style=\"color:#7a6544\">#{{ tg }}<\u002Fspan>\n                              <\u002Fsc-for>\n                            <\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Farticle>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ emptyState }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border:1.5px dashed rgba(36,26,16,.2);padding:70px 30px;text-align:center;margin-top:20px\">\n                <div style=\"font-weight:900;font-size:clamp(30px,5vw,54px);text-transform:uppercase;color:#c9b79a\">Nothing here yet<\u002Fdiv>\n                <p style=\"font-family:'Space Mono',monospace;font-size:13px;letter-spacing:.1em;color:#7a6544;margin:14px 0 24px\">THE PAGE IS BLANK. WRITE SOMETHING — IT SAVES RIGHT HERE AND WAITS FOR YOU.<\u002Fp>\n                <button onclick=\"{{ openNew }}\" style=\"cursor:pointer;background:#e9a53f;color:#0f0b08;border:none;font-family:'Space Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.14em;padding:14px 26px;box-shadow:6px 6px 0 #c1442a\">+ WRITE THE FIRST ONE<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isCalendar }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:clamp(20px,3vw,44px) clamp(18px,4vw,64px) 120px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;margin-bottom:34px\">\n              <div>\n                <div style=\"font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.28em;color:#c1442a;font-weight:700;margin-bottom:6px\">02 — THE GRID<\u002Fdiv>\n                <h2 style=\"margin:0;font-weight:900;font-size:clamp(38px,6vw,74px);line-height:.9;text-transform:uppercase;letter-spacing:-.02em\">{{ monthLabel }}<\u002Fh2>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <button onclick=\"{{ prevMonth }}\" style=\"cursor:pointer;background:transparent;border:1.5px solid rgba(36,26,16,.2);color:#241a10;font-family:'Space Mono',monospace;font-weight:700;font-size:16px;width:48px;height:48px;transition:all .13s\" style-hover=\"background:#e9a53f;color:#0f0b08;border-color:#a5620c\">←<\u002Fbutton>\n                <button onclick=\"{{ nextMonth }}\" style=\"cursor:pointer;background:transparent;border:1.5px solid rgba(36,26,16,.2);color:#241a10;font-family:'Space Mono',monospace;font-weight:700;font-size:16px;width:48px;height:48px;transition:all .13s\" style-hover=\"background:#e9a53f;color:#0f0b08;border-color:#a5620c\">→<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;gap:14px;flex-wrap:wrap;margin-bottom:28px\">\n              <div style=\"border:1.5px solid rgba(36,26,16,.15);background:#fbf5ea;padding:16px 22px;min-width:150px\"><div style=\"font-weight:900;font-size:44px;line-height:1;color:#a5620c\">{{ entriesMonth }}<\u002Fdiv><div style=\"font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;color:#7a6544;margin-top:6px\">ENTRIES THIS MONTH<\u002Fdiv><\u002Fdiv>\n              <div style=\"border:1.5px solid rgba(36,26,16,.15);background:#fbf5ea;padding:16px 22px;min-width:150px\"><div style=\"font-weight:900;font-size:44px;line-height:1;colo .5px solid rgba(36,26,16,.2);outline:none;color:#5a4a34;font-family:'Instrument Serif',serif;font-size:19px;line-height:1.4;padding:12px 14px;resize:vertical\" style-focus=\"border-color:#a5620c\"><\u002Ftextarea>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px\">\n            <div>\n              <label style=\"display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.18em;color:#7a6544;font-weight:700;margin-bottom:10px\">MOOD<\u002Flabel>\n              <div style=\"display:flex;gap:6px\">\n                <sc-for list=\"{{ moodOpts }}\" as=\"m\" hint-placeholder-count=\"5\">\n                  <button onclick=\"{{ m.pick }}\" title=\"{{ m.label }}\" style=\"cursor:pointer;flex:1;height:44px;border:1.5px solid {{ m.ring }};background:{{ m.fill }};transition:all .12s\"><\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <label style=\"display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.18em;color:#7a6544;font-weight:700;margin-bottom:10px\">ENERGY<\u002Flabel>\n              <div style=\"display:flex;gap:6px\">\n                <sc-for list=\"{{ energyOpts }}\" as=\"en\" hint-placeholder-count=\"5\">\n                  <button onclick=\"{{ en.pick }}\" style=\"cursor:pointer;flex:1;height:44px;border:1.5px solid rgba(36,26,16,.2);background:{{ en.fill }};color:{{ en.fg }};font-family:'Space Mono',monospace;font-weight:700;font-size:13px;transition:all .12s\">{{ en.v }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div>\n            <label style=\"display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.18em;color:#7a6544;font-weight:700;margin-bottom:10px\">TAGS<\u002Flabel>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ composerTags }}\" as=\"t\" hint-placeholder-count=\"6\">\n                <button onclick=\"{{ t.toggle }}\" style=\"cursor:pointer;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.12em;padding:8px 13px;border:1.5px solid {{ t.border }};background:{{ t.bg }};color:{{ t.fg }};transition:all .12s\">#{{ t.name }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:8px;padding:12px 22px;border-top:1.5px solid rgba(36,26,16,.15);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;color:#7a6544\">\n          <sc-if value=\"{{ justSaved }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"display:inline-flex;align-items:center;gap:7px;color:#1f8a5b;font-weight:700\"><span style=\"width:8px;height:8px;background:#1f8a5b;border-radius:50%;display:inline-block\"><\u002Fspan>SAVED TO YOUR LEDGER — AUTOSAVES AS YOU TYPE<\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ notSavedYet }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"color:#8a7758\">START TYPING — IT SAVES AUTOMATICALLY<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:0;border-top:2px solid rgba(36,26,16,.15)\">\n          <button onclick=\"{{ discardDraft }}\" style=\"cursor:pointer;flex:1;background:transparent;border:none;color:#7a6544;font-family:'Space Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.14em;padding:18px;transition:all .13s\" style-hover=\"background:#f0d3cb;color:#c1442a\">DISCARD<\u002Fbutton>\n          <button onclick=\"{{ closeComposer }}\" style=\"cursor:pointer;flex:2;background:#e9a53f;border:none;color:#0f0b08;font-family:'Space Mono',monospace;font-weight:700;font-size:13px;letter-spacing:.16em;padding:18px;transition:all .13s\" style-hover=\"background:#f4cf63\">DONE ✓<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;openTo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;landing&quot;,&quot;app&quot;],&quot;default&quot;:&quot;landing&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behavior&quot;},&quot;filmGrain&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Atmosphere&quot;},&quot;cursorLight&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Atmosphere&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'landing', wiping: false, view: 'timeline',\n    entries: [], query: '', activeTag: null, now: new Date(),\n    composerOpen: false, draft: null, draftOriginal: null, savedAt: 0, monthCursor: new Date(),\n  };\n\n  MOODS = [\n    { v:1, label:'BLEAK', color:'#8f2f1a' },\n    { v:2, label:'LOW', color:'#c1442a' },\n    { v:3, label:'STEADY', color:'#c98a3c' },\n    { v:4, label:'GOOD', color:'#e9a53f' },\n    { v:5, label:'SOARING', color:'#f4cf63' },\n  ];\n  ALL_TAGS = ['WORK','IDEAS','HEALTH','READING','PEOPLE','TRAVEL'];\n  KEY = 'ledger.entries.v4';\n  _glow = React.createRef();\n  _file = React.createRef();\n\n  componentDidMount(){\n    if(this.props.openTo==='app') this.setState({screen:'app'});\n    this.load();\n    this._t = setInterval(()=> this.setState({ now:new Date() }), 1000);\n    this._mv = (e)=>{ const g=this._glow.current; if(g) g.style.background = `radial-gradient(600px circle at ${e.clientX}px ${e.clientY}px, rgba(200,140,50,.12), transparent 62%)`; };\n    window.addEventListener('mousemove', this._mv);\n  }\n  componentWillUnmount(){ clearInterval(this._t); window.removeEventListener('mousemove', this._mv); }\n\n  load(){\n    let raw=null; try{ raw=localStorage.getItem(this.KEY); }catch(e){}\n    if(raw){ try{ const p=JSON.parse(raw); if(Array.isArray(p)){ this.setState({entries:p}); return; } }catch(e){} }\n    this.setState({entries:[]});\n  }\n  persist(list){ try{ localStorage.setItem(this.KEY, JSON.stringify(list)); }catch(e){} }\n  save(list){ this.setState({entries:list}); this.persist(list); }\n\n  _dk(d){ return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }\n  _mood(v){ return this.MOODS.find(m=>m.v===v)||this.MOODS[2]; }\n  _streak(){\n    const set=new Set(this.state.entries.map(e=>this._dk(new Date(e.ts))));\n    let d=new Date(); d.setHours(0,0,0,0);\n    if(!set.has(this._dk(d))) d.setDate(d.getDate()-1);\n    let n=0; while(set.has(this._dk(d))){ n++; d.setDate(d.getDate()-1); }\n    return n;\n  }\n  _visible(){\n    const q=this.state.query.trim().toLowerCase(); const t=this.state.activeTag;\n    return this.state.entries.filter(e=>{\n      const okT=!t || (e.tags||[]).includes(t);\n      const okQ=!q || (e.title+' '+e.body+' '+(e.tags||[]).join(' ')).toLowerCase().includes(q);\n      return okT && okQ;\n    }).sort((a,b)=>b.ts-a.ts);\n  }\n\n  enter(){ this.setState({wiping:true}); setTimeout(()=> this.setState({screen:'app', wiping:false}), 580); }\n  goHome(){ this.setState({screen:'landing'}); }\n  setView(v){ this.setState({view:v}); }\n  openNew(){ this.setState({composerOpen:true, draftOriginal:null, savedAt:0, draft:{id:null,title:'',body:'',mood:3,energy:3,tags:[],ts:Date.now()}}); }\n  openEdit(en){ this.setState({composerOpen:true, draftOriginal:{...en, tags:[...(en.tags||[])]}, savedAt:0, draft:{...en, tags:[...(en.tags||[])]}}); }\n  // live autosave: every change writes straight into the ledger\n  setDraft(patch){\n    let draft={...this.state.draft, ...patch};\n    let entries=this.state.entries;\n    const hasContent=(draft.title&&draft.title.trim())||(draft.body&&draft.body.trim());\n    let savedAt=this.state.savedAt;\n    if(hasContent){\n      if(!draft.id) draft={...draft, id:'e'+Math.random().toString(36).slice(2,9)};\n      const rec={...draft, title:(draft.title&&draft.title.trim())||'UNTITLED'};\n      entries = entries.some(e=>e.id===draft.id) ? entries.map(e=>e.id===draft.id?rec:e) : [rec, ...entries];\n      this.persist(entries); savedAt=Date.now();\n    }\n    this.setState({draft, entries, savedAt});\n  }\n  toggleDraftTag(t){ const cur=this.state.draft.tags||[]; const tags=cur.includes(t)? cur.filter(x=>x!==t):[...cur,t]; this.setDraft({tags}); }\n  closeComposer(){ this.setState({composerOpen:false, draft:null, draftOriginal:null}); }\n  discardDraft(){\n    const d=this.state.draft; const orig=this.state.draftOriginal;\n    let list=this.state.entries;\n    if(orig){ list=this.state.entries.map(e=>e.id===orig.id? orig : e); }\n    else if(d&&d.id){ list=this.state.entries.filter(e=>e.id!==d.id); }\n    this.save(list); this.setState({composerOpen:false, draft:null, draftOriginal:null});\n  }\n  removeEntry(id){ this.save(this.state.entries.filter(e=>e.id!==id)); }\n  shiftMonth(n){ this.setState(s=>{ const d=new Date(s.monthCursor); d.setDate(1); d.setMonth(d.getMonth()+n); return {monthCursor:d}; }); }\n  exportEntries(){\n    const data=JSON.stringify(this.state.entries,null,2);\n    const blob=new Blob([data],{type:'application/json'});\n    const url=URL.createObjectURL(blob);\n    const a=document.createElement('a'); const d=new Date();\n    const p=(x)=>String(x).padStart(2,'0');\n    a.href=url; a.download='daily-ledger-'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.json';\n    document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(()=>URL.revokeObjectURL(url),1500);\n  }\n  triggerImport(){ const el=this._file.current; if(el) el.click(); }\n  importEntries(ev){\n    const f=ev.target.files&&ev.target.files[0];\n    if(!f){ return; }\n    const reader=new FileReader();\n    reader.onload=()=>{\n      try{\n        const arr=JSON.parse(reader.result);\n        if(Array.isArray(arr)){\n          const map=new Map();\n          [...arr,...this.state.entries].forEach(e=>{ if(e&&e.id) map.set(e.id,e); });\n          const merged=[...map.values()].sort((a,b)=>b.ts-a.ts);\n          this.save(merged);\n          this.setState({screen:'app', view:'timeline'});\n        } else { window.alert('That file doesn\\u2019t look like a ledger backup.'); }\n      }catch(err){ window.alert('Could not read that backup file.'); }\n      ev.target.value='';\n    };\n    reader.readAsText(f);\n  }\n\n  renderVals(){\n    const now=this.state.now;\n    const dd=(n)=>String(n).padStart(2,'0');\n    const WD=['SUN','MON','TUE','WED','THU','FRI','SAT'];\n    const MO=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];\n    const clock = dd(now.getHours())+':'+dd(now.getMinutes())+':'+dd(now.getSeconds());\n    const todayLong = WD[now.getDay()]+' '+dd(now.getDate())+' '+MO[now.getMonth()]+' '+now.getFullYear();\n\n    const visible=this._visible();\n    const gmap=new Map();\n    visible.forEach(e=>{ const d=new Date(e.ts); const k=this._dk(d); if(!gmap.has(k)) gmap.set(k,{d,items:[]}); gmap.get(k).items.push(e); });\n    const bars=(v)=>'▮'.repeat(v)+'▯'.repeat(5-v);\n    const groups=[...gmap.values()].map(g=>({\n      day: dd(g.d.getDate()), month: MO[g.d.getMonth()], weekday: WD[g.d.getDay()],\n      count: g.items.length, plural: g.items.length===1?'Y':'IES',\n      items: g.items.map(e=>{ const m=this._mood(e.mood); return {\n        title:e.title, body:e.body, time: dd(new Date(e.ts).getHours())+':'+dd(new Date(e.ts).getMinutes()),\n        moodColor:m.color, moodLabel:m.label, energyBar:bars(e.energy), tags:e.tags||[],\n        edit:()=>this.openEdit(e), remove:()=>this.removeEntry(e.id),\n      }; }),\n    }));\n\n    const at=this.state.activeTag;\n    const tagChips=this.ALL_TAGS.map(name=>{ const active=at===name; return {\n      name, hash: active?'✕ ':'# ',\n      border: active?'#e9a53f':'rgba(36,26,16,.2)',\n      bg: active?'#e9a53f':'transparent', fg: active?'#0f0b08':'#7a6544',\n      toggle:()=>this.setState({activeTag: active?null:name}),\n    }; });\n\n    const navItems=[\n      {key:'timeline',icon:'▤',label:'TIMELINE'},\n      {key:'calendar',icon:'▦',label:'CALENDAR'},\n      {key:'stats',icon:'▥',label:'INSIGHTS'},\n    ].map(n=>({ ...n, go:()=>this.setView(n.key),\n      bg: this.state.view===n.key?'#c1442a':'transparent',\n      fg: this.state.view===n.key?'#0f0b08':'#7a6544' }));\n\n    // composer\n    const draft=this.state.draft;\n    const moodOpts=this.MOODS.map(m=>{ const sel=!!(draft&&draft.mood===m.v); return {v:m.v,label:m.label,color:m.color, sel, fill:m.color, ring: sel?'#241a10':'rgba(15,11,8,.55)', pick:()=>this.setDraft({mood:m.v})}; });\n    const energyOpts=[1,2,3,4,5].map(v=>{ const on=!!(draft&&draft.energy>=v); return {v, on, fill:on?'#c1442a':'transparent', fg:on?'#0f0b08':'#7a6544', pick:()=>this.setDraft({energy:v})}; });\n    const composerTags=this.ALL_TAGS.map(name=>({name, on:!!(draft&&draft.tags.includes(name)), border:(draft&&draft.tags.includes(name))?'#e9a53f':'rgba(36,26,16,.2)', bg:(draft&&draft.tags.includes(name))?'#e9a53f':'transparent', fg:(draft&&draft.tags.includes(name))?'#0f0b08':'#7a6544', toggle:()=>this.toggleDraftTag(name)}));\n\n    // calendar\n    const mc=this.state.monthCursor; const cy=mc.getFullYear(), cm=mc.getMonth();\n    const startDow=new Date(cy,cm,1).getDay(); const daysIn=new Date(cy,cm+1,0).getDate();\n    const dayMap={}; this.state.entries.forEach(e=>{ const d=new Date(e.ts); if(d.getFullYear()===cy&&d.getMonth()===cm){ (dayMap[d.getDate()]=dayMap[d.getDate()]||[]).push(e); } });\n    const cells=[]; for(let i=0;i<startDow;i++) cells.push({blank:true});\n    for(let n=1;n<=daysIn;n++){ const items=dayMap[n]||[]; const avg=items.length?Math.round(items.reduce((a,e)=>a+e.mood,0)/items.length):0; const mm=avg?this._mood(avg):null;\n      const isTd=now.getFullYear()===cy&&now.getMonth()===cm&&now.getDate()===n;\n      cells.push({blank:false, day:dd(n), count:items.length, has:items.length>0, empty:items.length===0, badge:items.length>1?String(items.length):'', color:mm?mm.color:'#e8dcc6', isToday:isTd, todayLine:isTd?'#e9a53f':'transparent'}); }\n    const monthLabel=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'][cm]+' '+cy;\n    const daysActiveMonth=Object.keys(dayMap).length;\n    const entriesMonth=Object.values(dayMap).reduce((a,x)=>a+x.length,0);\n\n    // stats\n    const total=this.state.entries.length;\n    const dayset=[...new Set(this.state.entries.map(e=>{const d=new Date(e.ts);d.setHours(0,0,0,0);return d.getTime();}))].sort((a,b)=>a-b);\n    let longest=dayset.length?1:0, run=dayset.length?1:0;\n    for(let i=1;i<dayset.length;i++){ if(dayset[i]-dayset[i-1]===86400000) run++; else run=1; if(run>longest) longest=run; }\n    const avgMood= total? (this.state.entries.reduce((a,e)=>a+e.mood,0)/total):0;\n    const avgMoodStr=avgMood?avgMood.toFixed(1):'0.0';\n    const avgMoodLabel= total? this._mood(Math.round(avgMood)).label : '—';\n    const moodDist=this.MOODS.slice().reverse().map(m=>{ const c=this.state.entries.filter(e=>e.mood===m.v).length; return {label:m.label,color:m.color,count:c,pct: total?Math.round(c/total*100):0}; });\n    const tagCount={}; this.state.entries.forEach(e=>(e.tags||[]).forEach(t=>tagCount[t]=(tagCount[t]||0)+1));\n    const tagMax=Math.max(1,...Object.values(tagCount));\n    const topTags=Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([name,c])=>({name,count:c,pct:Math.round(c/tagMax*100)}));\n    const wdCount=[0,0,0,0,0,0,0]; this.state.entries.forEach(e=>wdCount[new Date(e.ts).getDay()]++);\n    const wdMax=Math.max(1,...wdCount);\n    const weekdays=WD.map((w,i)=>({label:w,count:wdCount[i],pct:Math.round(wdCount[i]/wdMax*100)}));\n    const heat=[]; for(let i=29;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); const c=this.state.entries.filter(e=>{const x=new Date(e.ts);return x.getFullYear()===d.getFullYear()&&x.getMonth()===d.getMonth()&&x.getDate()===d.getDate();}); const avg=c.length?Math.round(c.reduce((a,e)=>a+e.mood,0)/c.length):0; heat.push({has:c.length>0, color:avg?this._mood(avg).color:'#e3d5bc'}); }\n\n    return {\n      isLanding: this.state.screen==='landing',\n      isApp: this.state.screen==='app',\n      wiping: this.state.wiping,\n      isTimeline: this.state.view==='timeline',\n      isCalendar: this.state.view==='calendar',\n      isStats: this.state.view==='stats',\n      glowRef: this._glow,\n      showGrain: this.props.filmGrain!==false,\n      showGlow: this.props.cursorLight!==false,\n      year: now.getFullYear(), clock, todayLong,\n      totalEntries: this.state.entries.length, streak: this._streak(),\n      query: this.state.query, onSearch:(e)=>this.setState({query:e.target.value}),\n      tagChips, navItems, groups,\n      hasGroups: groups.length>0, emptyState: groups.length===0,\n      enter:()=>this.enter(), goHome:()=>this.goHome(), openNew:()=>this.openNew(),\n      fileRef: this._file,\n      exportEntries:()=>this.exportEntries(),\n      triggerImport:()=>this.triggerImport(),\n      onImportFile:(e)=>this.importEntries(e),\n      canExport: this.state.entries.length>0,\n      openEdit:(e)=>this.openEdit(e),\n      composerOpen: this.state.composerOpen, isEditing: !!(draft&&draft.id),\n      composerHeading: (draft&&draft.id)?'EDIT ENTRY':'NEW ENTRY · '+todayLong,\n      draftTitle: draft?draft.title:'', draftBody: draft?draft.body:'',\n      onDraftTitle:(e)=>this.setDraft({title:e.target.value}),\n      onDraftBody:(e)=>this.setDraft({body:e.target.value}),\n      moodOpts, energyOpts, composerTags,\n      closeComposer:()=>this.closeComposer(), discardDraft:()=>this.discardDraft(),\n      justSaved: this.state.savedAt>0, notSavedYet: !(this.state.savedAt>0),\n      cells, monthLabel, daysActiveMonth, entriesMonth,\n      prevMonth:()=>this.shiftMonth(-1), nextMonth:()=>this.shiftMonth(1),\n      total, longest, avgMoodStr, avgMoodLabel, moodDist, topTags, weekdays, heat,\n      hasTopTags: topTags.length>0,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
